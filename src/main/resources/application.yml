spring:
  application:
    name: sleep-analytics-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sleep_analytics}
    username: ${DB_USERNAME:sleep}
    password: ${DB_PASSWORD:sleep}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  error:
    include-message: never
